<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <div class="container">
        <h1>To-Do-Application</h1>
        <div class="main">
            <input class="input-class" type="text" placeholder="Enter your task">
            <select id="progress-menu">
                <option value="" disabled selected>Progress</option>
                <option value="progress">In progress</option>
                <option value="review">Under-Review</option>
                <option value="finished">Finished</option>
            </select>

            <select id="difficulty-menu">
                <option value="" disabled selected>Difficulty</option>
                <option value="Low">Low</option>
                <option value="Medium">Medium</option>
                <option value="Urgent">Urgent</option>
            </select>

            <input type="date" name="Trip-start" id="date-class">

            <button class="btn-task">Add task</button>
        </div>
        <div class="preview">

        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
