<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Github-Profile-Founder</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="top-section">
      <h3>Github Finder</h3>
      <input type="text" name="search" id="profile-search" />
      <button class="search">Search</button>
      <p class="error-msg"></p>
    </div>

    <div class="profile-card">
      <img
        class="avatar"
        src="https://avatars.githubusercontent.com/u/583231?v=4"
        alt="GitHub profile avatar"
      />

      <div class="profile-info">
        <h2 class="name"></h2>
        <p class="username"></p>

        <p class="bio">
          GitHub's mascot. Developer and open source enthusiast.
        </p>
        <a href="" class="profile-url" target="_blank"></a>

        <div class="stats">
          <div>
            <strong class="followers">1,234</strong>
            <span>Followers</span>
          </div>

          <div>
            <strong class="following">56</strong>
            <span>Following</span>
          </div>

          <div>
            <strong class="repositories">42</strong>
            <span>Repositories</span>
          </div>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
