<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="quiz-card">
    <h1>Quick Quiz</h1>
    <h2 id="question"></h2>

<label class="option">
    <input type="radio" name="answer" id="a">
    <span id="a_text"></span>
</label>
<label class="option">
    <input type="radio" name="answer" id="b">
    <span id="b_text"></span>
</label>
<label class="option">
    <input type="radio" name="answer" id="c">
    <span id="c_text"></span>
</label>
<label class="option">
    <input type="radio" name="answer" id="d">
    <span id="d_text"></span>
</label>
    <button class="submitbtn">Next question</button>
  </main>
<script type="module" src="script.js"></script>

</body>
</html>
