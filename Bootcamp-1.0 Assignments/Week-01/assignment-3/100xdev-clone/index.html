<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>100x-dev clone</title>
    <link rel="stylesheet" href="style.css" />
    <link href="https://fontshare.com" rel="stylesheet" />
  </head>
  <body>
    <nav class="main-nav">
      <div class="logo">
        <img src="image/100xdevs-profile-512.webp" alt="image" />
        <span>100xDevs</span>
      </div>

      <div class="search-bar">
        <input type="text" placeholder="Search courses" />
      </div>

      <div class="button-nav">
        <button class="btn1">Login</button>
        <button class="btn2">Join now</button>
      </div>
    </nav>

    <div class="hero-container">
      <div class="hero-glow"></div>
      <section class="hero">
        <h1 class="heading">
          <span class="brand-text">100xDevs</span>
          <span class="normal-text"
            >by Harkirat <br />
            Singh</span
          >
        </h1>

        <p class="para">
          Build practical skills through coding cohorts and bootcamps in <br />
          web development, DevOps, Web3, AI, and machine learning.
        </p>

        <div class="button">
          <button class="explore-btn">Explore Courses</button>
          <button class="start-btn">Get Started</button>
        </div>
      </section>

      <nav class="sub-nav">
        <a href="">100xDevs Bootcamp</a>
        <a href="">100xDevs Cohort</a>
        <a href="">Full Stack Cohort</a>
        <a href="">DevOps Bootcamp</a>
        <a href="">Web3 Bootcamp</a>
        <a href="">AI Bootcamp</a>
      </nav>

    </div>
  </body>
</html>
