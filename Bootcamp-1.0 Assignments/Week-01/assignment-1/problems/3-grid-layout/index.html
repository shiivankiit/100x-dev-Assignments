<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flex-Layout</title>
    <style>
      .main {
        display: grid;
        grid-template-columns: 1fr 2fr;
        max-width: 1200px;
        height: 50px;
        margin: 0 auto;
        gap: 5px;
      }
      .left {
        display: flex;
        align-items: center;
        background-color: red;
      }
      .right {
        display: flex;
        align-items: center;
        background-color: blue;
      }
    </style>
  </head>
  <body>
    <div class="main">
      <div class="left">Left</div>
      <div class="right">Right</div>
    </div>
  </body>
</html>
