<html>
  <head>
    <title>Complicated-Grid</title>
    <style>
      .container{
        display: grid;
        grid-template-columns: 1fr 2fr;
        max-width: 800px;
      }
      .left{
        background-color: red;
      }
      .right{
        background-color: blue;
      }
      .text{
        display: grid;
        grid-template-columns: 1fr 1fr 1fr ;
      }
      .para{
        font-size: 30px;
        text-align: center;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="left">
        <p class="para">Left</p>
        <h3>
           text text text text 
        text text text text 
        text text text text 
        </h3>
       
      </div>
      <div class="right">
       <div class="text">
         <h2>Col 1</h2>
                <h2>Col 2</h2>
                <h2>Col 3</h2>
                <h2>Col 1</h2>
                <h2>Col 2</h2>
                <h2>Col 3</h2>
                <h2>Col 1</h2>
                <h2>Col 2</h2>
                <h2>Col 3</h2>
       </div>
      </div>
    </div>
  </body>
</html>
